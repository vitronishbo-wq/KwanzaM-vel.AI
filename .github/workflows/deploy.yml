name: KMOS Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: kmos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  FIREBASE_PROJECT_ID: "kwanza-movel-ai-sandbox"

jobs:
  # ============================================================
  # 1. CI — TYPECHECK + PRODUCTION BUILD
  # ============================================================
  build:
    name: Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Strict Typecheck
        run: npm run lint

      - name: Production Build
        env:
          NODE_ENV: production

          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

        run: npm run build

      - name: Upload Production Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: kmos-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # ============================================================
  # 2. CD — FIREBASE HOSTING
  # ============================================================
  deploy-frontend:
    name: Deploy Firebase Hosting
    needs: build

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Production Artifact
        uses: actions/download-artifact@v4
        with:
          name: kmos-dist
          path: dist/

      - name: Verify Production Artifact
        run: test -f dist/index.html

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live