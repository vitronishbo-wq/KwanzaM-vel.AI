name: KMOS Production Ritual Pipeline

# ============================================================
# RITUAL CANÓNICO KMOS:
# Google AI Studio → GitHub → Render → Firebase Hosting → Firestore
# ============================================================

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================================
  # 1. CI: VALIDAÇÃO & BUILD COMPLETO
  # ============================================================
  build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Verificação Estrita de Tipos (TypeScript)
        run: npm run lint

      - name: Compilar Produção (Frontend SPA + Backend Node.js Bundle)
        env:
          NODE_ENV: production
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'kwanza-movel-ai-sandbox' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'kwanza-movel-ai-sandbox.firebaseapp.com' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'kwanza-movel-ai-sandbox.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '414488387152' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:414488387152:web:438ce273cd1f7d381afb55' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-YD74T4BDHB' }}
        run: npm run build

      - name: Salvar Artefactos de Build
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 1

  # ============================================================
  # 2. CD: DEPLOY DO BACKEND (RENDER WEB SERVICE)
  # ============================================================
  deploy-render:
    name: Trigger Render Backend Deploy
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Acionar Deploy Hook no Render
        if: env.RENDER_HOOK != ''
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Disparando deploy hook do serviço backend no Render..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  # ============================================================
  # 3. CD: DEPLOY DO FRONTEND & REGRAS (FIREBASE HOSTING & FIRESTORE)
  # ============================================================
  deploy-firebase:
    name: Deploy Firebase Hosting & Firestore Rules
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar Artefactos de Build
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: Publicar no Firebase Hosting
        if: env.FIREBASE_SA != ''
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: kwanza-movel-ai-sandbox
          channelId: live
